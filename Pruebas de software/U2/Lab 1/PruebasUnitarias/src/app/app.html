<div class="contenedor">
  <div class="formulario">
    <h1>{{ title() }}</h1>
    <p>Completa el formulario para crear tu cuenta</p>

    <form (ngSubmit)="onSubmit()">
      <!-- Nombre -->
      <label for="nombre">Nombre:</label>
      <input 
        type="text" 
        id="nombre" 
        name="nombre" 
        [(ngModel)]="nombre" 
        placeholder="Tu nombre"
        required
      />

      <!-- Apellido -->
      <label for="apellido">Apellido:</label>
      <input 
        type="text" 
        id="apellido" 
        name="apellido" 
        [(ngModel)]="apellido" 
        placeholder="Tu apellido"
        required
      />

      <!-- Email -->
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email" 
        placeholder="correo@ejemplo.com"
        required
      />

      <!-- Edad -->
      <label for="edad">Edad (opcional):</label>
      <input 
        type="number" 
        id="edad" 
        name="edad" 
        [(ngModel)]="edad" 
        placeholder="18"
        min="0"
        max="120"
      />

      <!-- Contraseña -->
      <label for="password">Contraseña:</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="password" 
        placeholder="Mínimo 6 caracteres"
        required
      />

      <!-- Confirmar Contraseña -->
      <label for="confirmPassword">Confirmar Contraseña:</label>
      <input 
        type="password" 
        id="confirmPassword" 
        name="confirmPassword" 
        [(ngModel)]="confirmPassword" 
        placeholder="Repite la contraseña"
        required
      />

      <!-- Términos y condiciones -->
      <div class="checkbox">
        <input 
          type="checkbox" 
          id="aceptaTerminos" 
          name="aceptaTerminos" 
          [(ngModel)]="aceptaTerminos"
        />
        <label for="aceptaTerminos">Acepto los términos y condiciones</label>
      </div>

      <!-- Mensajes -->
      @if (errorMessage) {
        <div class="mensaje error">
          {{ errorMessage }}
        </div>
      }
      @if (successMessage) {
        <div class="mensaje exito">
          {{ successMessage }}
        </div>
      }

      <!-- Botones -->
      <button type="submit">Registrarse</button>
      <button type="button" (click)="clearForm()">Limpiar</button>
    </form>
  </div>
</div>
